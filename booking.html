<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="css/booking-style.css">
  <title>Запис на масаж</title>
</head>
<body>
  <script src="js/script.js"></script>
  <script src="js/booking-script.js"></script>


  <div class="booking-container">
    <h2>Оформлення запису</h2>
    
    <form id="bookingForm">
      
      <!-- 2. Вибір послуги (заповниться автоматично, але можна змінити) -->
      <div class="form-group">
        <label for="service">Оберіть послугу:</label>
        <select id="service" name="service" required>
          <option value="">-- Оберіть варіант --</option>
          <option value="allbody">Масаж всього тіла</option>
          <option value="lymph">Лімфодренажний масаж</option>
          <option value="cellulite">Антицелюлітний масаж</option>
          <option value="cellulite-applied">Апаратний антицелюлітний масаж</option>
          <option value="sports">Спортивний масаж</option>
          <option value="neck">Масаж спини та шийно-комірцевої зони</option>
          <option value="face">Масаж обличчя</option>
          <option value="face-applied">Апаратний масаж обличчя</option>
          <option value="honey">Медовий масаж</option>
          <option value="bottle">Баночний масаж</option>
        </select>
      </div>

      <!-- 3. Тривалість послуги -->
      <div class="form-group">
        <label for="duration">Тривалість послуги:</label>
        <select id="duration" name="duration" required>
          <option value="">-- Оберіть тривалість --</option>
        </select>
      </div>

      <!-- 4. Дані гостя -->
      <div class="form-group">
        <label for="first-name">Ім'я та прізвище:</label>
        <input type="text" id="first-name" name="firstName" required minlength="2" maxlength="100" placeholder="Ваше ім'я та прізвище">
      </div>

      <div class="form-group">
        <label for="phone">Номер телефону:</label>
        <input type="tel" id="phone" name="phone" required pattern="^\+[0-9 ]{8,20}$" placeholder="+380XXXXXXXXX">
      </div>

      <!-- 5. Вибір дати -->
      <div class="form-group">
        <label for="date">Оберіть дату:</label>
        <!-- Обмеження на 60 днів ми додамо через JavaScript -->
        <input type="date" id="date" name="date" required>
      </div>

      <!-- 6. Вибір часу -->
      <div class="form-group">
        <label for="time">Оберіть час:</label>
        <select id="time" name="time" required disabled>
          <option value="">Спочатку оберіть дату...</option>
          <!-- Сюди JS підтягуватиме вільні години з 09:00 до 19:00 -->
        </select>
      </div>

      <!-- 7. Вибір масажиста -->
      <div class="form-group">
        <label for="master">Оберіть масажиста:</label>
        <select id="master" name="master" required>
          <option value="">-- Будь-який вільний майстер --</option>
          <option value="master1">Таїсія (Масажист)</option>
          <option value="master2">Співробітниця (Масажист)</option>
        </select>
      </div>

      <!-- 8. Нагадування в Telegram -->
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="telegram-toggle" name="wantTelegram">
          Хочу отримати нагадування в Telegram
        </label>
      </div>

      <!-- 9. Поле для Telegram (приховане за замовчуванням) -->
      <div class="form-group" id="telegram-input-block" style="display: none;">
        <label for="telegram">Ваш нікнейм або номер в Telegram:</label>
        <input type="text" id="telegram" name="telegram" placeholder="@username або номер">
      </div>

      <button type="submit" class="btn submit-btn">Підтвердити запис</button>
    </form>
  </div>

  <!-- Підключаємо логіку анкети -->
  <script src="booking-script.js"></script>
</body>
</html>
